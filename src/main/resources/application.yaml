spring:
  application:
    name: hrm_api
  datasource:
    url: jdbc:postgresql://db.[your-supabase-project-ref].supabase.co:5432/postgres
    username: postgres
    password: [your-supabase-password]
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
hrm:
  app:
    jwtSecret: mySecretKey
    jwtExpirationMs: 86400000
