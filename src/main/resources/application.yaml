spring:
  application:
    name: hrm_api
  datasource:
    # Connect to PostgreSQL running via docker-compose on localhost
    url: jdbc:postgresql://localhost:5432/hrm_db
    username: hrm_user
    password: change_me
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

hrm:
  app:
    jwtSecret: mySecretKey
    jwtExpirationMs: 86400000
